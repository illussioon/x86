[package]
name = "x86-native"
version = "0.1.8"
authors = ["x86 contributors"]
edition = "2024"
rust-version = "1.85"
description = "Cross-platform native x86 machine library with image, bootloader, and saved-state APIs"
license = "BSD-2-Clause OR MIT"
repository = "https://github.com/illussioon/x86"
exclude = ["dist/**"]
keywords = ["x86", "emulator", "machine", "disk-image", "bootloader"]
categories = ["emulators", "hardware-support"]

[lib]
name = "x86"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "x86-console"
path = "src/bin/x86-console.rs"

[[bin]]
name = "x86-test-server"
path = "src/bin/x86-test-server.rs"

[features]
default = ["remote", "zstd", "native-runtime"]
remote = ["dep:ureq"]
zstd = ["dep:zstd"]
native-runtime = ["dep:native-v86-core"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.9.7", optional = true, default-features = false, features = ["tls"] }
zstd = { version = "0.13", optional = true }
crossterm = "0.29"
native-v86-core = { package = "native-v86-core", version = "0.1.6", path = "native-v86-core", optional = true, features = ["native-interpreter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
